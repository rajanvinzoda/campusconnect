version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_secure_production_password_2026
      POSTGRES_DB: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_admin -d campusconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusconnect_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusconnect_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://campus_admin:campus_secure_production_password_2026@postgres:5432/campusconnect?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: campus_jwt_access_secret_super_secure_key_2026_production
      JWT_REFRESH_SECRET: campus_jwt_refresh_secret_super_secure_key_2026_production
      BOOTSTRAP_SECRET: campus_bootstrap_secret_secure_2026
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: "*"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data:
